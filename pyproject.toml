[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsaid"
version = "0.1.0"
description = "WhatsApp Chat Information Extractor"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.2",
    "urlextract>=1.8.0",
    "tldextract>=5.1.1",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    # API layer
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
]

[project.scripts]
whatsaid = "whatsaid.__main__:main"
whatsaid-api = "whatsaid.api.main:start"

[tool.setuptools.packages.find]
where = ["src"]
